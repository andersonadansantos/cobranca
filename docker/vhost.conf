<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/cobranca

    # ============================================================
    # Site público (marketing) fica na RAÍZ do domínio.
    # /cobranca = SOMENTE o sistema SaaS.
    # ============================================================

    # Acesso em /cobranca ou /cobranca/ vai direto ao login do painel (SaaS)
    RedirectMatch 301 ^/cobranca/?$ /cobranca/admin/login.php

    # Páginas públicas do site não são mais servidas sob /cobranca
    RedirectMatch 301 ^/cobranca/index\.php(.*)$ /$1
    RedirectMatch 301 ^/cobranca/planos\.php(.*)$ /planos.php$1
    RedirectMatch 301 ^/cobranca/demo\.php(.*)$ /demo.php$1
    RedirectMatch 301 ^/cobranca/cadastro\.php(.*)$ /cadastro.php$1
    RedirectMatch 301 ^/cobranca/pagamento\.php(.*)$ /pagamento.php$1

    # SaaS (admin, usuario, superadmin, api, app, assets) em /cobranca
    Alias /cobranca /var/www/html/cobranca

    <Directory /var/www/html/cobranca>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>